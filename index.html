<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arnav Khamparia — AI Product Engineer</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='%23060709'/><g stroke='%2310b981' stroke-width='1.1'><line x1='20' y1='6' x2='8' y2='34'/><line x1='20' y1='6' x2='32' y2='34'/><line x1='14' y1='22' x2='26' y2='22'/></g><g fill='%2310b981'><circle cx='20' cy='6' r='2.4'/><circle cx='8' cy='34' r='1.8'/><circle cx='32' cy='34' r='1.8'/><circle cx='14' cy='22' r='1.8'/><circle cx='26' cy='22' r='1.8'/></g></svg>" />

  <meta name="description" content="Arnav Khamparia — AI Product Engineer at OTO Capital. Production LLM systems, RAG pipelines, real-time voice agents, and a published Springer paper." />
  <meta property="og:title" content="Arnav Khamparia — AI Product Engineer" />
  <meta property="og:description" content="I build AI systems that work in production." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://arnavkhamparia.netlify.app" />
  <meta property="og:image" content="https://arnavkhamparia.netlify.app/assets/images/profile.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      background: #060709;
      color: #f4f5f7;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    ::selection { background: #10b981; color: #060709; }

    /* hide native cursor on fine-pointer devices (custom cursor active) */
    @media (pointer: fine) {
      * { cursor: none !important; }
    }

    /* Lenis */
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: hidden; }

    /* grid / crosshair texture (reusable) */
    .grid-texture::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      z-index: 0;
    }
    .grid-texture.light::before {
      background-image:
        linear-gradient(rgba(10,12,16,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,12,16,0.04) 1px, transparent 1px);
    }
    .grid-texture > * { position: relative; z-index: 1; }

    /* corner crosshair marks */
    .xhair { position: absolute; width: 12px; height: 12px; pointer-events: none; z-index: 3; }
    .xhair::before, .xhair::after { content: ''; position: absolute; background: rgba(16,185,129,0.5); }
    .xhair::before { left: 5px; top: 0; width: 1px; height: 12px; }
    .xhair::after  { top: 5px; left: 0; height: 1px; width: 12px; }

    /* ── keyframes ── */
    @keyframes studio-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes studio-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
      70%     { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
    }
    @keyframes studio-wave { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1.25); } }
    @keyframes studio-nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }

    /* ── responsive ── */
    @media (max-width: 860px) {
      .studio-desktop-nav { display: none !important; }
      .studio-mobile-btn  { display: flex !important; }
      .nav-clock          { display: none !important; }
      .hero-debug         { display: none !important; }
      .work-grid          { grid-template-columns: 1fr !important; direction: ltr !important; }
      .contact-cols       { grid-template-columns: 1fr !important; }
      .act-indicator      { display: none !important; }
    }
    @media (min-width: 861px) {
      .studio-mobile-btn { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Lenis smooth scroll -->
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Components -->
  <script type="text/babel" src="studio/core.jsx"></script>
  <script type="text/babel" src="studio/chrome.jsx"></script>
  <script type="text/babel" src="studio/hero.jsx"></script>
  <script type="text/babel" src="studio/works.jsx"></script>
  <script type="text/babel" src="studio/acts.jsx"></script>
  <script type="text/babel" src="studio/contact.jsx"></script>

  <!-- App -->
  <script type="text/babel">
    function Sliver({ from, to }) {
      return <div aria-hidden="true" style={{ height: 'clamp(60px,9vh,120px)', background: `linear-gradient(to bottom, ${from}, ${to})` }} />;
    }

    function App() {
      return (
        <>
          <StudioLoader />
          <StudioCursor />
          <ScrollProgress />
          <ActIndicator />
          <StudioNav />
          <StudioCornerBadge />
          <main>
            <StudioHero />

            {/* WORKS act */}
            <div id="works-label" className="grid-texture" style={{ background: '#060709', paddingTop: 'clamp(50px,12vh,140px)', position: 'relative' }}>
              <ActLabel label="WORKS" index="02" dark />
            </div>
            <StudioWorks />

            {/* dark to light */}
            <Sliver from="#060709" to="#eceef0" />

            {/* MISSION + VISION (light) */}
            <MissionVision />

            {/* light to dark */}
            <Sliver from="#eceef0" to="#060709" />

            {/* PROCESS act */}
            <div className="grid-texture" style={{ background: '#060709', paddingTop: 'clamp(50px,12vh,140px)', position: 'relative' }}>
              <ActLabel label="PROCESS" index="04" dark align="right" />
            </div>
            <StudioProcess />

            {/* CURRENTLY */}
            <StudioCurrently />

            {/* dark to light */}
            <Sliver from="#060709" to="#eceef0" />

            {/* MARKS (light) */}
            <StudioMarks />

            {/* light to dark */}
            <Sliver from="#eceef0" to="#060709" />

            {/* CONTACT + footer */}
            <StudioContact />
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    /* ── Lenis smooth scroll init ── */
    setTimeout(() => {
      if (window.Lenis && !window.__lenis) {
        const lenis = new Lenis({ duration: 1.15, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true });
        window.__lenis = lenis;
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
      }
    }, 300);
  </script>
</body>
</html>
